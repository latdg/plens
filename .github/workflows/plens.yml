# =============================================================================
# PLENS I ÀUDIOS LLARGS — La TdG · 04.10.2026
# Repositori PÚBLIC latdg/plens (minuts il·limitats i màquines de 4 processadors).
# Fitxers: .github/workflows/plens.yml i plens.py (a l'arrel del repositori).
# Secrets: TELEGRAM_TOKEN_PLENS i HF_TOKEN.
# =============================================================================
name: Plens

on:
  workflow_dispatch:
    inputs:
      chat_id: { description: "xat", required: true }
      missatge_id: { description: "missatge", required: false, default: "" }
      estat_id: { description: "missatge d'estat", required: false, default: "" }
      url: { description: "enllaç (Drive o YouTube)", required: false, default: "" }
      file_id: { description: "fitxer de Telegram", required: false, default: "" }
      nom: { description: "nom del fitxer", required: false, default: "" }
      titol: { description: "títol", required: false, default: "" }
      model: { description: "turbo o aina", required: false, default: "turbo" }
      parlants: { description: "nombre de parlants (opcional)", required: false, default: "" }

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_PLENS }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CHAT_ID: ${{ inputs.chat_id }}
  MISSATGE_ID: ${{ inputs.missatge_id }}
  ESTAT_ID: ${{ inputs.estat_id }}
  URL_AUDIO: ${{ inputs.url }}
  FILE_ID: ${{ inputs.file_id }}
  NOM: ${{ inputs.nom }}
  TITOL: ${{ inputs.titol }}
  MODEL: ${{ inputs.model }}
  PARLANTS: ${{ inputs.parlants }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      trams: ${{ steps.p.outputs.trams }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Eines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp gdown requests
      - name: Descarregar i tallar
        id: p
        run: python3 plens.py preparar
      - uses: actions/upload-artifact@v4
        with: { name: audio, path: treball/, retention-days: 1 }

  transcriure:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tros: ${{ fromJson(needs.preparar.outputs.trams) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Model desat (si ja s'havia descarregat)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}
      - name: Eines
        run: pip install -q --prefer-binary "av==14.2.0" "faster-whisper>=1.1"
      - uses: actions/download-artifact@v4
        with: { name: audio, path: treball/ }
      - name: Transcriure el tros ${{ matrix.tros }}
        run: python3 plens.py transcriure ${{ matrix.tros }}
      - uses: actions/upload-artifact@v4
        with: { name: "paraules-${{ matrix.tros }}", path: "treball/paraules_*.json", retention-days: 1 }

  parlants:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Model desat (si ja s'havia descarregat)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pyannote-3.1
      - name: Eines
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q "pyannote.audio==3.3.2" "numpy<2"
      - uses: actions/download-artifact@v4
        with: { name: audio, path: treball/ }
      - name: Identificar qui parla
        run: python3 plens.py parlants
      - uses: actions/upload-artifact@v4
        with: { name: parlants, path: treball/parlants.json, retention-days: 1 }

  unir:
    needs: [preparar, transcriure, parlants]
    if: ${{ always() && needs.preparar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Corrector desat (si ja s'havia descarregat)
        uses: actions/cache@v4
        with: { path: ~/languagetool, key: languagetool-stable }
      - name: Descarregar el corrector (LanguageTool, el motor de Softcatalà)
        continue-on-error: true
        run: |
          if [ -z "$(ls ~/languagetool 2>/dev/null)" ]; then
            curl -sL -o lt.zip https://languagetool.org/download/LanguageTool-stable.zip
            mkdir -p ~/languagetool && unzip -q lt.zip -d ~/languagetool && rm -f lt.zip
          fi
      - run: pip install -q requests
      - uses: actions/download-artifact@v4
        with: { path: baixat/ }
      - name: Ajuntar
        run: |
          mkdir -p treball
          cp baixat/audio/info.json treball/
          cp baixat/paraules-*/*.json treball/ 2>/dev/null || true
          cp baixat/parlants/parlants.json treball/ 2>/dev/null || true
      - name: Unir, corregir i enviar
        run: python3 plens.py unir

  avis:
    needs: [preparar, unir]
    if: ${{ failure() && needs.preparar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 plens.py error
