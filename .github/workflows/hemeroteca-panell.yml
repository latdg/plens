# Panell -> hemeroteca — La TdG · 02.11.2026
# Cada nit envia al Cercador Hemeroteca La TdG un .txt amb el que va sortir per
# primer cop al panell La TdG redacció aquell dia, perquè el bot d'hemeroteca ho
# trobi. Abans era a latdg/redaccio; és aquí perquè aquest repo ja té els
# secrets CERCA_URL i CERCA_CLAU (l'XTEC no deixa veure la porta per copiar-los).
# El codi és el de latdg/redaccio (eines/hemeroteca.mjs, repo públic); la llista
# de dies ja enviats es desa aquí, a estat/hemeroteca-enviats.json.
# També es pot llançar a mà.
name: Panell a l'hemeroteca

on:
  schedule:
    - cron: "47 22 * * *"   # 23.47 a l'hivern (00.47 a l'estiu), després de l'última actualització del panell
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hemeroteca-panell
  cancel-in-progress: false

jobs:
  envia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Baixa el panell (latdg/redaccio)
        uses: actions/checkout@v4
        with:
          repository: latdg/redaccio
          path: redaccio
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envia els dies nous
        env:
          CERCA_URL: ${{ secrets.CERCA_URL }}
          CERCA_CLAU: ${{ secrets.CERCA_CLAU }}
        run: |
          if [ -f estat/hemeroteca-enviats.json ]; then
            cp estat/hemeroteca-enviats.json redaccio/dades/hemeroteca-enviats.json
          fi
          cd redaccio && node eines/hemeroteca.mjs
      - name: Desa els dies enviats
        run: |
          mkdir -p estat
          if [ -f redaccio/dades/hemeroteca-enviats.json ]; then
            cp redaccio/dades/hemeroteca-enviats.json estat/hemeroteca-enviats.json
          fi
          git config user.name "La TdG (hemeroteca)"
          git config user.email "latdg@laguait.cat"
          git add estat/hemeroteca-enviats.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Res de nou."; exit 0; fi
          git commit -q -m "Panell a l'hemeroteca ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::No s'ha pogut desar la llista de dies enviats."; exit 1
